name: Build + Publish container

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/lodu/odido-bundle-replenisher

permissions:
  contents: read
  packages: write

concurrency:
  group: build-publish-container-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    uses: ./.github/workflows/test.yaml
  build:
    name: Build (${{ matrix.architecture }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - architecture: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: type=raw,value=${{ github.ref_name }}-${{ matrix.architecture }}
          labels: |
            org.opencontainers.image.authors=lodu <git@lodu.dev>
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=container-${{ matrix.architecture }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.architecture }}

  publish-manifest:
    name: Publish multi-architecture manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/metadata-action@v5
        id: meta
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: index
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.authors=lodu <git@lodu.dev>
      - name: Publish manifest
        env:
          ANNOTATIONS: ${{ steps.meta.outputs.annotations }}
        run: |
          tag="$GITHUB_REF_NAME"
          annotation_args=()
          while IFS= read -r line; do
            [ -n "$line" ] && annotation_args+=(--annotation "$line")
          done <<< "$ANNOTATIONS"
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$tag" \
            "${annotation_args[@]}" \
            "$IMAGE_NAME:$tag-amd64" \
            "$IMAGE_NAME:$tag-arm64"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            docker buildx imagetools create \
              --tag "$IMAGE_NAME:latest" \
              "${annotation_args[@]}" \
              "$IMAGE_NAME:$tag-amd64" \
              "$IMAGE_NAME:$tag-arm64"
          fi
