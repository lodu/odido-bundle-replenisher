name: Cargo tests

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -- -D warnings
      - run: cargo fmt -- --check
      - run: cargo test --locked
