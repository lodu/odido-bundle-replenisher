[package]
name = "odido-bundle-replenisher"
version = "1.3.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Auto top-up voor unlimited Odido SIM's."
repository = "https://github.com/lodu/odido-bundle-replenisher"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
fernet = { version = "0.2.2", default-features = false, features = ["rustcrypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls  = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
http = "1.5.0"
