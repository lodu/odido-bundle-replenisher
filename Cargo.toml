[package]
name = "odido-bundle-replenisher"
version = "1.2.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Auto top-up voor unlimited Odido SIM's."
repository = "https://github.com/lodu/odido-bundle-replenisher"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.6", features = ["derive"] }
dotenvy = "0.15.7"
fernet = "0.2.2"
nyquest = { version = "0.5.0", features = ["blocking", "json"] }
nyquest-preset = { version = "0.5.0", features = ["blocking"] }
openssl = { version = "0.10", features = ["vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
url = "2.5.8"
